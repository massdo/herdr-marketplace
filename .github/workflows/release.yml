# Publishes the prebuilt binaries that scripts/fetch-or-build.sh installs.
# Adapted from herdr-npm v0.1.0, itself adapted from herdr-sidebar 0.13.0
# .github/workflows/release.yml (MIT, see NOTICE). A pull request that touches
# the release path builds the three binaries and their FFmpeg without
# publishing anything.
name: release

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/build.sh
      - scripts/fetch-or-build.sh
      - scripts/build-ffmpeg.sh
      - scripts/check-ffmpeg.sh
      - scripts/release-version.sh
      - scripts/test-release-version.sh
      - tests/fixtures/tiny.mp4
      - Cargo.toml
      - Cargo.lock
      - herdr-plugin.toml
      - rust-toolchain.toml

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
      tag: ${{ steps.commit.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check versions and pin the release commit
        id: commit
        run: |
          version=$(sh scripts/release-version.sh)
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Pull requests already run it in ci.yml.
  check:
    if: github.event_name == 'push'
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: release commit
        env:
          COMMIT: ${{ needs.versions.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$COMMIT"
      - name: Install Rust
        run: rustup toolchain install 1.89.0 --profile minimal --component clippy --component rustfmt
      - name: offline suite
        run: sh scripts/check.sh

  build:
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: aarch64-apple-darwin
            os: macos-15
            arch: arm64
          - triple: x86_64-apple-darwin
            os: macos-15-intel
            arch: x86_64
          - triple: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            arch: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      BIN: target/${{ matrix.triple }}/release/herdr-marketplace
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: release commit and runner architecture
        env:
          COMMIT: ${{ needs.versions.outputs.commit }}
          ARCH: ${{ matrix.arch }}
        run: |
          test "$(git rev-parse HEAD)" = "$COMMIT"
          test "$(uname -m)" = "$ARCH"
      - name: Install Rust
        run: rustup toolchain install 1.89.0 --profile minimal --target ${{ matrix.triple }}
      - name: musl-tools
        if: matrix.triple == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: build
        run: |
          rustc --version
          cargo build --release --locked --target ${{ matrix.triple }} --bin herdr-marketplace
      - name: --help on the runner architecture
        run: ./"$BIN" --help
      - name: static link
        if: matrix.triple == 'x86_64-unknown-linux-musl'
        run: |
          file "$BIN"
          readelf -lW "$BIN" > "$RUNNER_TEMP/program-headers"
          readelf -dW "$BIN" > "$RUNNER_TEMP/dynamic-section"
          if grep -q 'program interpreter' "$RUNNER_TEMP/program-headers" || grep -q '(NEEDED)' "$RUNNER_TEMP/dynamic-section"; then
            echo "::error::$BIN is not statically linked"
            exit 1
          fi
      - name: stage asset
        run: |
          mkdir dist
          cp "$BIN" "dist/herdr-marketplace-${{ matrix.triple }}"
      # The private FFmpeg of README videos travels in the same artifact.
      - name: nasm
        if: matrix.triple == 'x86_64-apple-darwin'
        run: brew install nasm
      - name: FFmpeg
        if: runner.os == 'macOS'
        run: sh scripts/build-ffmpeg.sh "dist/ffmpeg-${{ matrix.triple }}"
      - name: FFmpeg, static in Alpine
        if: matrix.triple == 'x86_64-unknown-linux-musl'
        run: docker run --rm -v "$PWD:/w" -w /w alpine:3.20 sh -c 'apk add --no-cache build-base nasm xz curl >/dev/null && sh scripts/build-ffmpeg.sh dist/ffmpeg-x86_64-unknown-linux-musl'
      - name: check FFmpeg
        run: sh scripts/check-ffmpeg.sh "dist/ffmpeg-${{ matrix.triple }}"
      - name: FFmpeg static link
        if: matrix.triple == 'x86_64-unknown-linux-musl'
        env:
          FFMPEG: dist/ffmpeg-x86_64-unknown-linux-musl
        run: |
          file "$FFMPEG"
          readelf -lW "$FFMPEG" > "$RUNNER_TEMP/ffmpeg-program-headers"
          readelf -dW "$FFMPEG" > "$RUNNER_TEMP/ffmpeg-dynamic-section"
          if grep -q 'program interpreter' "$RUNNER_TEMP/ffmpeg-program-headers" || grep -q '(NEEDED)' "$RUNNER_TEMP/ffmpeg-dynamic-section"; then
            echo "::error::$FFMPEG is not statically linked"
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: herdr-marketplace-${{ matrix.triple }}
          path: dist/
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [versions, check, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: herdr-marketplace-*
          path: artifacts
      - name: assemble and verify release files
        env:
          COMMIT: ${{ needs.versions.outputs.commit }}
        run: |
          assets="herdr-marketplace-aarch64-apple-darwin herdr-marketplace-x86_64-apple-darwin herdr-marketplace-x86_64-unknown-linux-musl ffmpeg-aarch64-apple-darwin ffmpeg-x86_64-apple-darwin ffmpeg-x86_64-unknown-linux-musl"
          test "$(find artifacts -mindepth 1 -maxdepth 1 | wc -l)" -eq 3
          mkdir release
          # The artifact of a target holds its binary and its FFmpeg.
          for asset in $assets; do
            triple=${asset#herdr-marketplace-}
            triple=${triple#ffmpeg-}
            artifact="artifacts/herdr-marketplace-$triple"
            test "$(ls "$artifact")" = "$(printf 'ffmpeg-%s\nherdr-marketplace-%s' "$triple" "$triple")"
            cp "$artifact/$asset" release/
          done
          printf '%s\n' "$COMMIT" > release/SOURCE_COMMIT
          cd release
          for asset in $assets; do
            sha256sum "$asset"
          done > SHA256SUMS
          test "$(find . -type f | wc -l)" -eq 8
          test "$(wc -l < SHA256SUMS)" -eq 6
          for asset in $assets; do
            test "$(grep -cE "^[0-9a-f]{64}  $asset\$" SHA256SUMS)" -eq 1
          done
          sha256sum --check --strict SHA256SUMS
          test "$(wc -l < SOURCE_COMMIT)" -eq 1
          grep -qxE '[0-9a-f]{40}' SOURCE_COMMIT
          cat SHA256SUMS SOURCE_COMMIT
      # Create the tag only after checks and all builds pass. Publish in this
      # run: a tag created with GITHUB_TOKEN does not trigger another workflow.
      # A rerun resumes the draft; a published release is never overwritten.
      - name: tag, draft, upload, verify, publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.versions.outputs.tag }}
          COMMIT: ${{ needs.versions.outputs.commit }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            test "$(git rev-parse "$TAG^{commit}")" = "$COMMIT"
          else
            gh api "repos/$GH_REPO/git/refs" --method POST \
              -f "ref=refs/tags/$TAG" -f "sha=$COMMIT"
          fi
          test "$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)" = "$COMMIT"
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft); then
            if [ "$draft" != true ]; then
              echo "::error::release $TAG is already published"
              exit 1
            fi
          else
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" release/* --clobber
          gh release download "$TAG" --dir uploaded
          test "$(ls release)" = "$(ls uploaded)"
          for file in release/*; do
            cmp "$file" "uploaded/${file#release/}"
          done
          test "$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)" = "$COMMIT"
          gh release edit "$TAG" --draft=false
