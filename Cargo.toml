[package]
name = "herdr-marketplace"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Marketplace sidebar for Herdr plugins"
license = "MIT"
repository = "https://github.com/massdo/herdr-marketplace"
publish = false

[lib]
name = "herdr_marketplace"
path = "src/lib.rs"

[[bin]]
name = "herdr-marketplace"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
crossterm = "0.29"
frizbee = "0.13"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
libc = "0.2"
percent-encoding = "2"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = "0.30"
resvg = { version = "0.48", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
toml = "0.8"
tempfile = "3"
unicode-general-category = "1"
unicode-width = "0.2"
ureq = "3"
