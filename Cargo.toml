[package]
name = "herdr-marketplace"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Marketplace sidebar for Herdr plugins"
repository = "https://github.com/massdo/herdr-marketplace"
publish = false

[lib]
name = "herdr_marketplace"
path = "src/lib.rs"

[[bin]]
name = "herdr-marketplace"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
