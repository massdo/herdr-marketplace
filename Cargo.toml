[package]
name = "herdr-marketplace"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Marketplace sidebar for Herdr plugins"
repository = "https://github.com/massdo/herdr-marketplace"
publish = false

[lib]
name = "herdr_marketplace"
path = "src/lib.rs"

[[bin]]
name = "herdr-marketplace"
path = "src/main.rs"

[dependencies]
crossterm = "0.29"
libc = "0.2"
frizbee = "0.13"
percent-encoding = "2"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
unicode-width = "0.2"
ureq = "3"
